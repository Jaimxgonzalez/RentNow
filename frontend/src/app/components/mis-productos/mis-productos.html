<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2>Mis Productos Publicados</h2>
      <p class="text-muted">Gestiona el catálogo de artículos que tienes en alquiler</p>
    </div>
    <button class="btn btn-primary">
      <i class="bi bi-plus-circle me-1"></i> Publicar Nuevo Producto
    </button>
  </div>

  <!-- Si no tiene productos -->
  <div *ngIf="misProductos.length === 0" class="alert alert-info text-center">
    Aún no has publicado ningún producto para alquilar. ¡Publica el primero!
  </div>

  <!-- Lista de Productos -->
  <div class="row row-cols-1 row-cols-md-3 g-4" *ngIf="misProductos.length > 0">
    <div class="col" *ngFor="let producto of misProductos">
      <div class="card h-100 shadow-sm">
        <img [src]="producto.imagenUrl" class="card-img-top" [alt]="producto.nombre" style="height: 180px; object-fit: cover;">
        
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <h5 class="card-title mb-0">{{ producto.nombre }}</h5>
            <span class="badge" 
                  [ngClass]="{
                    'bg-success': producto.estado === 'Disponible',
                    'bg-warning text-dark': producto.estado === 'Alquilado',
                    'bg-secondary': producto.estado === 'Mantenimiento'
                  }">
              {{ producto.estado }}
            </span>
          </div>
          
          <p class="text-muted small mb-2">Categoría: {{ producto.categoria }}</p>
          <p class="fw-bold text-primary fs-5 mb-3">${{ producto.precioDia | number }} <small class="fs-6 text-muted">/ día</small></p>

          <div class="d-flex justify-content-between gap-2">
            <button class="btn btn-outline-secondary btn-sm flex-fill">
              Editar
            </button>
            <button class="btn btn-outline-danger btn-sm flex-fill" (click)="eliminarProducto(producto.id)">
              Eliminar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
